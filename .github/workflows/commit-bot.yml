name: Daily Commit Logger

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log-commit:
    if: github.event_name != 'push' || github.event.head_commit.message != 'chore: update daily commit log'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Configure git
        run: |
          git config user.name "alham-rizvi"
          git config user.email "alham-rizvi@users.noreply.github.com"

      - name: Configure remote auth
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"
            echo "Using personal access token for push"
          else
            echo "No GH_PAT provided; pushing with the default GitHub token"
          fi

      - name: Make script executable
        run: chmod +x scripts/update_daily_commit_log.sh

      - name: Update daily commit log
        run: |
          ./scripts/update_daily_commit_log.sh

      - name: Commit and push changes
        run: |
          git add daily-commits.log
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update daily commit log"
          git push origin HEAD:${GITHUB_REF_NAME}
